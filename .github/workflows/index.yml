name: build index
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths: [build_index.py, blocklist.json, verified.json]
permissions:
  contents: write
concurrency:
  group: index
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_index.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.json icons covers 2>/dev/null || git add -A
          git diff --cached --quiet || (git commit -m "index: update" && git push)
